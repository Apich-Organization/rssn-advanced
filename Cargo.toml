[package]
name = "rssn-advanced"
version = "0.1.5"
edition = "2024"
rust-version = "1.93.0"
authors = ["The rssn-advanced developers"]
description = "This is rssn-advanced: The next generation symbolic core of rssn."
license = "Apache-2.0"
repository = "https://github.com/Apich-Organization/rssn-advanced"
homepage = "https://github.com/Apich-Organization/rssn-advanced"
readme = "README.md"
keywords = [
    "scientific-computing",
    "symbolic-math",
    "numerical-analysis",
    "physics-simulation",
    "optimization",
]
categories = [
    "science",
    "mathematics",
    "data-structures",
    "simulation",
    "algorithms",
]
exclude = []

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[profile.bench]
lto = true
codegen-units = 1
opt-level = 3
strip = false
debug = true
debug-assertions = false
overflow-checks = false
incremental = true

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3
strip = true
debug = false
debug-assertions = false
overflow-checks = false
incremental = true

[profile.dev]
lto = false
opt-level = 0
debug = true

[dependencies]
bincode-next = "3.0.0-rc.15"
pastey = "0.2"
libc = { version = "0.2", optional = true }
rapidhash = { version = "4.4", default-features = false }
arbitrary = { version = "1.4", optional = true }
windows-sys = { version = "0.61", features = [
    "Win32_Security",
    "Win32_System_Diagnostics",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_SystemInformation",
] }
nom = "8.0"
smallvec = "1.15"
cranelift-frontend = { version = "0.132", optional = true }
cranelift-native = { version = "0.132", optional = true }
cranelift-codegen = { version = "0.132", optional = true }
cranelift-module = { version = "0.132", optional = true }
cranelift-jit = { version = "0.132", optional = true }
wgpu = { version = "29.0", optional = true }
pollster = { version = "1.0", optional = true }
bytemuck = { version = "1.21", optional = true }
dtact = "0.2"

[build-dependencies]
cbindgen = "0.29"

[features]
# JIT is enabled by default.  The `cranelift-jit` named feature is used as the
# primary gate (all #[cfg(feature = "cranelift-jit")] sites check this).
# It activates the `jit` feature which pulls in the actual Cranelift crates.
# Disable JIT with `--no-default-features` for size-constrained builds.
default = ["cranelift-jit"]

# `cranelift-jit` is the stable gate name used in #[cfg] throughout the codebase.
"cranelift-jit" = ["jit"]

# `jit` enables the Cranelift crate deps.  Because all #[cfg] gates check
# `feature = "cranelift-jit"`, use `--features cranelift-jit` (not `--features jit`)
# when overriding features on the command line.
jit = [
    "dep:cranelift-jit",
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-module",
    "dep:cranelift-native",
]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dev-dependencies]
loom = "0.7"
proptest = "1.6"
criterion = { version = "0.8", features = ["async_tokio"] }
tokio = { version = "1.52", features = ["full"] }
serial_test = "3.0"
libc = "0.2"
windows-sys = { version = "0.61", features = [
    "Win32_Security",
    "Win32_System_Diagnostics",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_SystemInformation",
] }
assert_approx_eq = "1.1"

[[bench]]
name = "rssn_advanced_benches"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "doc-header.html"]

[lints.clippy]
empty-line-after-doc-comments = "allow"
