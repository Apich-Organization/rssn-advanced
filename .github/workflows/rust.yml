name: Rust CI

on:
  push:
    branches: [trunk, main, 'v*.x', 'ci/*']
  pull_request:
    branches: [trunk, main, 'v*.x']

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta, nightly, 1.91.1] # MSRV: 1.91.1
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (all-features)
        run: cargo check --all-features

  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --all-features

  lints:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-features
  
  compatibility:
    name: Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91.1
      - uses: Swatinem/rust-cache@v2
      - name: Run compatibility tests
        run: cargo test --manifest-path compatibility/Cargo.toml

  # Project-policy gates. `ban_seqcst.sh` enforces `plan.md §4.2`
  # (Acquire/Release only; no SeqCst). `ban_panic_in_src.sh` enforces
  # Phase 7 of dev_plan.md (no `.unwrap()` / `.expect()` / `assert!*`
  # outside `#[cfg(test)]`). Both scripts are pure-bash + GNU coreutils
  # so we only run them on Linux.
  policy:
    name: Policy gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Ensure scripts are executable
        run: chmod +x scripts/ban_seqcst.sh scripts/ban_panic_in_src.sh
      - name: ban_seqcst.sh
        run: bash scripts/ban_seqcst.sh
      - name: ban_panic_in_src.sh
        run: bash scripts/ban_panic_in_src.sh
